name: Build ANCHOR Full

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # This is the magic step: It installs Gradle 8.2 specifically
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      # We run 'gradle' directly instead of './gradlew' 
      # because the wrapper files are missing in your repo.
      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anchor-full-debug
          path: app/build/outputs/apk/debug/app-debug.apk
